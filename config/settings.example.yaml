# ============================================================
#  楓之谷經典版自動化腳本 — 設定範例
#  複製本檔為 settings.yaml 後再依實際情況修改。
#  （settings.yaml 已列入 .gitignore，不會被提交）
# ============================================================

# ---- 目標遊戲視窗 ----
window:
  title: "MapleStory"    # 視窗標題關鍵字（部分符合即可）；找不到時退回主螢幕
  region: null           # 手動指定擷取區域 [left, top, width, height]；null = 依視窗自動偵測

# ---- 螢幕擷取 ----
capture:
  backend: "mss"         # mss | windows-capture
  fps_limit: 15          # 擷取頻率上限（每秒張數），避免 CPU 過載

# ---- 按鍵綁定（請對應你的遊戲內設定）----
keys:
  move_left: "left"
  move_right: "right"
  up: "up"
  down: "down"
  jump: "alt"
  attack: "ctrl"           # 主要攻擊技能
  primary_skill: "a"
  buff_skills: ["f1", "f2"]
  hp_potion: "delete"      # 補血
  mp_potion: "end"         # 補魔
  change_channel: "pageup" # 換頻（依實際流程調整）
  interact: "space"        # 撿取 / 對話

# ---- 影像辨識閾值 ----
vision:
  template_match_threshold: 0.80    # 模板匹配相似度門檻 (0~1)，越高越嚴格
  minimap:
    # 小地圖上「自己」的黃點顏色範圍（HSV）
    player_color_lower: [24, 180, 180]
    player_color_upper: [40, 255, 255]
    # 其他玩家 / rune 標記顏色（供偵測是否有人、rune 位置）
    other_color_lower: [0, 0, 200]
    other_color_upper: [180, 40, 255]
  health_bar:
    # 角色頭上血條顏色範圍（HSV），用於在畫面中定位角色
    hp_color_lower: [0, 120, 120]
    hp_color_upper: [10, 255, 255]

# ---- 生存維持 ----
survival:
  hp_threshold: 0.50     # HP 低於此比例即補血
  mp_threshold: 0.30     # MP 低於此比例即補魔
  potion_cooldown: 1.0   # 兩次補水最短間隔（秒）

# ---- rune（天使符文）自動解謎 ----
rune:
  enabled: true
  detect_interval: 5.0   # 偵測間隔（秒）

# ---- 行為隨機化（降低機械化特徵，切勿視為防偵測保證）----
humanize:
  key_press_min: 0.03    # 按鍵按住最短時間（秒）
  key_press_max: 0.09    # 最長時間
  action_delay_min: 0.05 # 動作與動作間最短延遲
  action_delay_max: 0.18 # 最長延遲

# ---- 路線 ----
routine:
  path: "config/routines/example.yaml"

# ---- 控制 ----
control:
  stop_hotkey: "f12"     # 緊急停止熱鍵

# ---- 日誌 ----
logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  file: "logs/bot.log"
