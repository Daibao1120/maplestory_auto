# ============================================================
#  楓之谷經典版自動化腳本 — 設定範例
#  複製本檔為 settings.yaml 後再依實際情況修改。
#  （settings.yaml 已列入 .gitignore，不會被提交）
#
#  ★ 座標基準：以下所有 ROI / 座標都是「相對遊戲視窗左上角」的像素，
#    參考視窗大小 1371x808（含標題列，取自 tests/data/擷取.PNG 實測校準）。
#    你的解析度/視窗大小不同時，請用 tools/capture_template.py 或自己的截圖重新校準。
# ============================================================

# ---- 目標遊戲視窗 ----
window:
  title: "新楓之谷"      # 視窗標題關鍵字（完整為「新楓之谷 · 經典版」）；找不到時退回主螢幕
  region: null           # 手動指定擷取區域 [left, top, width, height]；null = 依視窗自動偵測

# ---- 遊戲/地圖資訊（僅供參考、顯示用）----
game:
  map_name: "戰火之地：沼澤地 I"
  map_id: 107000000        # 墮落城市一帶；寬幅、大致平坦、橫向動線長 → 地面左右橫向巡邏
  job: "archer"            # 弓箭手（遠程）
  # 目標怪：鱷魚 Croco Lv32，HP1200 / MP40 / EXP60，移速-40(很慢)、迴避12、可擊退。
  # → 好瞄準、可風箏/擊退控場；HP1200 需連續多發，攻擊迴圈「對同側持續輸出到怪消失」。

# ---- 螢幕擷取 ----
capture:
  backend: "mss"         # mss | windows-capture
  fps_limit: 12          # 擷取頻率上限（每秒張數）

# ---- 按鍵綁定（請對應你的遊戲內設定）----
keys:
  move_left: "left"
  move_right: "right"
  up: "up"
  down: "down"
  jump: "alt"
  attack: "ctrl"           # 主要攻擊技能（弓箭手放箭）；實際鍵位由 combat.attack_key 覆蓋
  buff_skills: ["f1", "f2"]
  hp_potion: "delete"      # 補血
  mp_potion: "end"         # 補魔
  change_channel: "pageup" # 換頻（依實際流程調整）
  interact: "space"        # 撿取 / 對話

# ---- 影像辨識（數值取自 戰火之地-沼澤地1 實際截圖）----
vision:
  template_match_threshold: 0.80

  minimap:
    # 小地圖「地圖區域」在畫面中的位置 [left, top, width, height]
    roi: [18, 131, 205, 74]
    # 代表「自己」的黃色菱形 HSV 範圍（OpenCV：H 0–179, S/V 0–255）
    player_color_lower: [24, 150, 150]
    player_color_upper: [42, 255, 255]
    min_blob_area: 2                 # 小於此面積(px)的色塊視為雜訊忽略
    # 防掉落：玩家點跨圈追蹤（過濾其他黃色標記造成的座標亂跳——
    # 亂讀一次座標，巡邏就可能朝錯方向走出平台）
    max_jump_px: 20                  # 相鄰兩圈玩家點最多移動這麼多小地圖 px，超過視為誤判丟棄
    reacquire_misses: 10             # 連續讀不到/丟棄滿 N 圈 → 當作真的被移動，重新定位
    stall_reset_loops: 8             # 有送移動鍵但座標連續 N 圈完全不動 → 追蹤點可能鎖錯，重新定位
    # 其他玩家的橘點顏色（供判斷是否有人佔點）★可再校準
    other_color_lower: [10, 150, 150]
    other_color_upper: [20, 255, 255]

  health_bar:
    # HP／MP 條在畫面中的位置 [left, top, width, height]
    # （用 擷取.PNG HP[1096/1346]=81.4%、MP[224/831]=27.0% 反推校準：
    #   紅色填充 x505~589=85px ÷ 0.814 ≈ 條全寬 104px；藍色 28px ÷ 0.270 ≈ 104px）
    hp_bar_roi: [505, 785, 104, 13]
    mp_bar_roi: [613, 785, 104, 13]
    hp_color_lower: [0, 120, 120]    # HP 條紅
    hp_color_upper: [10, 255, 255]
    mp_color_lower: [95, 120, 120]   # MP 條藍
    mp_color_upper: [135, 255, 255]

  monster:
    # 怪物模板資料夾：放你自己的「鱷魚」截圖（可多張不同動作/方向以提高命中率）
    template_dir: "assets/templates/monsters"
    # 0.62 只抓得到 2/5 隻（右平台整排動作不同分數只有 0.49~0.54）；
    # 0.50 可抓 4/5。多補幾張右平台鱷魚的截圖模板後可調回 0.55+。
    match_threshold: 0.50
    nms_iou: 0.30                    # NMS IoU 門檻（重疊超過此值視為同一隻）
    # 搜尋 ROI [left, top, width, height]：涵蓋上下兩個平台帶（上平台鱷魚中心 y≈430、
    # 右平台 y≈488，加上換平台時鏡頭上下移的餘裕），同時排除小地圖與底部 UI。
    # 「打不打得到」交給 combat.attack_y_band 過濾，這裡只管看得到。null = 全畫面。
    roi: [0, 330, 1371, 270]

# ---- 生存維持 ----
survival:
  hp_threshold: 0.50     # HP 低於此比例即補血
  mp_threshold: 0.25     # MP 低於此比例即補魔
  potion_cooldown: 1.0   # 兩次補水最短間隔（秒）

# ---- 打怪 / 攻擊（弓箭手：遠程定點射擊，面向怪那側放主力技）----
# 主力技（Lv30–40 二轉）：獵人(弓)=爆炸箭(範圍濺射+暈眩)；弩手(弩)=貫穿箭(直線穿透+冰凍)。
# → 面向鱷魚那一側站定放技能，一次打一排；對同側持續輸出到怪消失。（箭雨是3轉技，此等級沒有）
combat:
  mode: "ranged"          # 遠程定點輸出
  attack_key: "ctrl"      # 主力技鍵位（已確認 = Ctrl）＝爆炸箭 / 貫穿箭
  combo: 3                # 每圈連放次數（HP1200 要多發，靠主迴圈持續輸出到怪消失）
  attack_range_px: 700    # 最近的鱷魚水平距離 <= 此值就放技能，否則走近一步
  # 單平台備援巡邏折返點（小地圖 x）：沒設定 platforms 時使用 ★需校準
  patrol_left_x: 40
  patrol_right_x: 175
  patrol_step_seconds: 0.35
  # 防掉落：折返點往內縮的安全邊界（小地圖 px）。感知→送鍵有延遲、一步會走
  # 過頭，貼著邊界才折返可能已經掉下去。平台越窄可設越小（最小 0）。
  patrol_edge_margin: 2
  # 防攻擊失效：定點站著打 ~60 秒攻擊會失效 → 每隔 45~65 秒（隨機）小步移動
  # 一下（往平台中心挪、絕不往邊界外），並讓那一輪換邊打。
  # reposition_min_seconds 設 0 可整個關閉。
  reposition_min_seconds: 45
  reposition_max_seconds: 65
  reposition_step_seconds: 0.2    # 每次挪動按住方向鍵的秒數；≲0.1 只會轉身不走路（等於沒動）
  reposition_swap_facing: true    # 挪動的那一輪順便換邊打（下一圈自動轉回怪多的那側）
  # 攻擊前轉向的按鍵時間（秒）。必須極短（只轉身、不走路）；按太久每圈都會
  # 往怪那側滑一小步，貼邊打怪時會慢慢滑出平台。
  turn_tap_seconds: 0.03
  player_screen_anchor: null   # 角色在畫面中的位置 [x,y]；null = 畫面中央

  # 同高度帶過濾 [lo, hi]：只打「怪中心y − 角色y」落在此範圍的怪。
  # 箭是水平飛的，別的平台的怪看得到但射不到，不濾會對空放箭卡死。
  # 實測（擷取.PNG）：同平台鱷魚 dy≈+26、另一平台 dy≈+84/−32 → [0, 60] 剛好分開。
  attack_y_band: [0, 60]

  # ---- 兩平台輪流清怪（拿掉整個 platforms 區塊 = 回到單平台巡邏）----
  # 座標全是「小地圖」座標。校準法：站上平台看 dry-run 印的 玩家(小地圖):(x, y)，
  # 走到平台左右端記下 x_range，站定時的 y 就是 minimap_y。
  # 以下初始值由 擷取.PNG 換算（你站左平台 mm=(52,38)；比例 ≈ 0.027 mm px/畫面 px），
  # 邊界超出畫面的部分是估的 ★請照上面校準法微調。
  platforms:
    - name: "左平台"
      x_range: [30, 48]     # 小地圖 x 巡邏範圍（左端★估計值）
      minimap_y: 38         # 站上去時的小地圖 y（實測）
      jump_x: null          # 要跳上此平台的起跳點(小地圖 x)；null = 走進 x_range 下方就邊走邊跳
    - name: "右平台"
      x_range: [56, 75]     # （右端★估計值）
      minimap_y: 40         # ★估計值（左平台 38 + 高度差換算 ≈ 2）
      jump_x: null
  platform_switch:
    empty_loops: 8          # 目前平台連續 N 圈沒可打的怪 → 換另一平台
    y_tolerance: 1          # 判定「站在平台上」的小地圖 y 容差
    x_tolerance: 2          # 判定「到達定點」的小地圖 x 容差
    max_move_loops: 40      # 換平台超過 N 圈仍沒到（卡住/跳不上去）→ 放棄，回守另一平台

# ---- rune（天使符文）自動解謎 ----
rune:
  enabled: true
  detect_interval: 5.0

# ---- 行為隨機化（降低機械化特徵，切勿視為防偵測保證）----
humanize:
  key_press_min: 0.03
  key_press_max: 0.09
  action_delay_min: 0.05
  action_delay_max: 0.18

# ---- 路線（沿平台巡邏；打怪優先於 routine）----
routine:
  path: "config/routines/example.yaml"

# ---- 控制 ----
control:
  stop_hotkey: "f12"

# ---- 日誌 ----
logging:
  level: "INFO"
  file: "logs/bot.log"
